version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: live-score-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: livescore
      POSTGRES_PASSWORD: livescore
      POSTGRES_DB: livescore
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U livescore -d livescore"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
